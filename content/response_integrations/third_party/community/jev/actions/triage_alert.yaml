creator: admin
description: 'Use Jev to triage the current alert. The action builds a structured
    state from the alert (name, rule, product, severity, entities and security event
    fields) and asks Jev whether the alert is malicious, how severe it is and what the
    analyst should do next ("close", "investigate", "escalate" or "contain"). The action
    result is the recommended action, so playbooks can branch on it. Add your own
    questions with "Custom Questions".'
dynamic_results_metadata:
-   result_example_path: resources/triage_alert_JsonResult_example.json
    result_name: JsonResult
    show_result: true
integration_identifier: Jev
name: Triage Alert
parameters:
-   default_value: ''
    description: Optional extra context added to the state, such as enrichment results
        from previous playbook steps or notes about your environment.
    is_mandatory: false
    name: Additional Context
    type: content
-   default_value: ''
    description: 'Optional JSON object of extra Jev questions, in the same format as
        the "Questions" parameter of "Evaluate Questions". A question id of "is_malicious",
        "severity" or "recommended_action" replaces the built-in question.'
    is_mandatory: false
    name: Custom Questions
    type: content
-   default_value: '10'
    description: Maximum number of security events from the alert to include in the
        state. Events are also dropped if the state gets too large for Jev. Default is 10.
    is_mandatory: false
    name: Max Events
    type: string
-   default_value: ''
    description: Optional model or alias that overrides the integration "Default Model",
        for example "jev-latest" or a pinned version such as "jev-1.13.0".
    is_mandatory: false
    name: Model
    type: string
script_result_name: recommended_action
