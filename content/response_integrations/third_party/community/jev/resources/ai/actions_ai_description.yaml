Triage Alert:
  ai_description: >-
    ### General Description


    Uses the Jev decision model to triage the current alert. Builds a structured state from
    the alert and its security events and entities, then asks whether the alert is malicious,
    how severe it is and what the analyst should do next. The action result is the recommended
    action (close, investigate, escalate or contain).



    ### Flow Description


    1. Extracts the additional context, custom questions, max events and model parameters.


    2. Loads the current alert and builds a JSON state with the alert name, rule, product,
    severity, entities and up to `Max Events` security events, trimmed to fit the model context.


    3. Sends the built-in triage questions, plus any custom questions, to the TypeSafe `/v1/systemone`
    endpoint.


    4. Returns the recommended action as the result value, with a triage summary in the JSON
    result and a data table.



    ### Additional Notes


    Custom questions with the ids is_malicious, severity or recommended_action replace the
    built-in questions.
  ai_short_description: >-
    Triages the current alert with Jev and returns maliciousness, severity and a recommended
    action.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
