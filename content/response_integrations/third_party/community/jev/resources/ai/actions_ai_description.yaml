Ask Score Question:
  ai_description: >-
    ### General Description


    Asks the Jev decision model to rate the provided content along an ordered rubric. Returns
    a probability-weighted score between 0 and the highest level index. The action result
    is the score.



    ### Flow Description


    1. Extracts the state, question, levels and model.


    2. Parses the levels from a comma-separated list or a JSON array, lowest first.


    3. Sends a score question to the TypeSafe `/v1/systemone` endpoint.


    4. Returns the score as the result value, with the closest level, a JSON result and a
    data table.



    ### Additional Notes


    Between 2 and 10 levels are supported.
