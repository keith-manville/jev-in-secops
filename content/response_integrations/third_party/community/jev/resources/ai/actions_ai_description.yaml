Ask Yes No Question:
  ai_description: >-
    ### General Description


    Asks the Jev decision model a yes/no question (a noul) about the provided content and
    returns the calibrated probability that the answer is yes. The action result is true when
    the probability is at or above the threshold.



    ### Flow Description


    1. Extracts the state, question, optional yes/no criteria, threshold and model.


    2. Parses the state as JSON when it is a JSON object or array, otherwise sends it as text.


    3. Sends a noul question to the TypeSafe `/v1/systemone` endpoint.


    4. Compares the returned probability with the threshold and sets the result value, JSON
    result and a data table.



    ### Additional Notes


    The threshold must be between 0 and 1.
