    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action reads the current alert from Google SecOps and sends it to the TypeSafe `/v1/systemone`
      endpoint for a read-only evaluation (`fetches_data`=true). It does not mutate external
      or internal data, update entities, create insights, modify alerts or add comments.
