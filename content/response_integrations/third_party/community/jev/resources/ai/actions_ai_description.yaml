Evaluate Questions:
  ai_description: >-
    ### General Description


    Asks the Jev decision model several typed questions (noul, choice or score) about the
    same content in a single request and returns every answer keyed by the question ids.



    ### Flow Description


    1. Extracts the state, the questions JSON and model.


    2. Validates that each question has a supported type, instructions and, for choice and
    score questions, criteria.


    3. Sends the questions to the TypeSafe `/v1/systemone` endpoint.


    4. Returns the raw answers as a JSON result and a data table.



    ### Additional Notes


    The question format follows the TypeSafe API reference at https://docs.typesafe.ai/api.
