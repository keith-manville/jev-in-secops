Ask Choice Question:
  ai_description: >-
    ### General Description


    Asks the Jev decision model to pick one option from a set of options for the provided
    content. Returns the chosen option, the probability of each option and a confidence score.
    The action result is the chosen option.



    ### Flow Description


    1. Extracts the state, question, options and model.


    2. Parses the options from a comma-separated list, a JSON array or a JSON object of option
    to description.


    3. Sends a choice question to the TypeSafe `/v1/systemone` endpoint.


    4. Returns the chosen option as the result value, with a JSON result and a data table.



    ### Additional Notes


    Between 2 and 255 options are supported.
  ai_short_description: >-
    Asks Jev to choose one option for content and returns the choice with its probabilities.
  capabilities:
    can_create_case_comments: false
    can_create_insight: false
    can_modify_alert_data: false
    can_mutate_external_data: false
    can_mutate_internal_data: false
    can_update_entities: false
    external_data_mutation_explanation: null
    fetches_data: true
    internal_data_mutation_explanation: null
    reasoning: >-
      The action sends a POST request to the TypeSafe `/v1/systemone` evaluation endpoint
      to get model answers, which is a read-only inference call that returns data (`fetches_data`=true)
      and does not change state in TypeSafe. It does not update entities, create insights,
      modify alerts or add case comments.
